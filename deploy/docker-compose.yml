name: bn-appmarket

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: bn_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: bn_appmarket
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bn_app -d bn_appmarket']
      interval: 5s
      retries: 12
    networks: [data]

  redis:
    image: redis:7.4.1-alpine
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 5s
      retries: 12
    networks: [data]

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      plugins.security.disabled: 'true'
      OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
    volumes:
      - searchdata:/usr/share/opensearch/data
    ports:
      - '127.0.0.1:9200:9200'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9200/_cluster/health >/dev/null']
      interval: 10s
      retries: 18
    networks: [data]

  minio:
    image: quay.io/minio/minio:RELEASE.2024-10-29T16-01-48Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local >/dev/null 2>&1 || curl -fsS http://localhost:9000/minio/health/ready >/dev/null']
      interval: 5s
      retries: 12
    networks: [data, quarantine]

  minio-buckets:
    image: minio/mc:RELEASE.2024-10-29T15-34-59Z
    entrypoint: ['/bin/sh', '-ec']
    command: >-
      mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
      mc mb --ignore-existing local/bn-quarantine-bucket;
      mc mb --ignore-existing local/bn-public-cdn-bucket;
      mc mb --ignore-existing local/bn-kyb-vault-bucket;
      mc anonymous set none local/bn-quarantine-bucket;
      mc anonymous set none local/bn-public-cdn-bucket;
      mc anonymous set none local/bn-kyb-vault-bucket
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    depends_on:
      minio: {condition: service_healthy}
    networks: [data]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      DATABASE_URL: postgres://bn_app:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/bn_appmarket?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
      OPENSEARCH_URL: http://opensearch:9200
      S3_HEALTH_URL: http://minio:9000/minio/health/ready
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:3000}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      opensearch: {condition: service_healthy}
      minio: {condition: service_healthy}
    ports:
      - '127.0.0.1:8080:8080'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [data]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    command: ['--config=/etc/otel/config.yaml']
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - '127.0.0.1:4318:4318'
    networks: [data]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - '127.0.0.1:9090:9090'
    networks: [data]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    ports:
      - '127.0.0.1:3001:3000'
    networks: [data]

networks:
  data:
  quarantine:
    internal: true

volumes:
  pgdata:
  redisdata:
  searchdata:
  miniodata:

