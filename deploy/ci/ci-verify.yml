name: Verify foundation
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum
      - name: Build
        working-directory: backend
        run: go build ./...
      - name: Race and coverage
        working-directory: backend
        run: go test -v -race -coverprofile=coverage.out ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: ignore
  security-and-contract:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum
      - name: Go static security analysis
        working-directory: backend
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.21.4
          "$(go env GOPATH)/bin/gosec" ./...
      - name: OpenAPI contract validation
        run: |
          npx --yes @redocly/cli@1.34.5 bundle BN_APP_MARKET_MASTER_BLUEPRINT/04_API_SPECIFICATION/openapi.yaml --output /tmp/appmarket-openapi.yaml
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Vulnerability and configuration scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
