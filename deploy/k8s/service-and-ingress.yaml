apiVersion: v1
kind: Service
metadata:
  name: bn-appmarket-api
  namespace: bn-appmarket
  labels:
    app.kubernetes.io/name: bn-appmarket-api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: bn-appmarket-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bn-appmarket-ingress
  namespace: bn-appmarket
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "2048m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://appmarket.dnjstjqppk.workers.dev"
spec:
  tls:
    - hosts:
        - api.appmarket.bookingnetwork.com
      secretName: bn-appmarket-tls
  rules:
    - host: api.appmarket.bookingnetwork.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bn-appmarket-api
                port:
                  number: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bn-appmarket-api-hpa
  namespace: bn-appmarket
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bn-appmarket-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
