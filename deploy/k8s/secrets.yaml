apiVersion: v1
kind: Secret
metadata:
  name: bn-appmarket-secrets
  namespace: bn-appmarket
type: Opaque
# Production values must be injected by sealed-secrets or external-secrets.
# Every MUST-REPLACE placeholder below fails closed at boot until replaced.
stringData:
  DATABASE_URL: "MUST-REPLACE-postgres-url"
  REDIS_URL: "MUST-REPLACE-redis-url"
  IAM_HMAC_SECRET: "MUST-REPLACE-32-plus-random-chars"
  DISTRIBUTION_TOKEN_SECRET: "MUST-REPLACE-32-plus-random-chars"
  PG_WEBHOOK_SECRET: "MUST-REPLACE-32-plus-random-chars"
  PAYOUT_ENC_KEY: "MUST-REPLACE-exactly-32-bytes-key!!!"
  JWT_PRIVATE_KEY_PEM: "MUST-REPLACE-pkcs8-pem"
  TOSS_SECRET_KEY: "MUST-REPLACE-toss-secret"
  PORTONE_API_KEY: "MUST-REPLACE-portone-api-key"
  GOOGLE_CLIENT_SECRET: "MUST-REPLACE-google-secret"
  GITHUB_CLIENT_SECRET: "MUST-REPLACE-github-secret"
  APPLE_PRIVATE_KEY_PEM: "MUST-REPLACE-apple-p8-pem"
  SENTRY_DSN: ""

